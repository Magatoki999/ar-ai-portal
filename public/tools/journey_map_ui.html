<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東海道五十三次 道中記 ｜ ルキルキの旅</title>
<style>
  :root {
    --paper: #f2e6c9;
    --paper-dark: #e6d5a8;
    --ink: #3a2c1a;
    --ink-soft: #6b5a3e;
    --red-seal: #a83232;
    --line: #8b7346;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: linear-gradient(180deg, #d9c69a, #c9b482);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    color: var(--ink);
  }

  .scroll {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--paper);
    border: 3px double var(--line);
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    padding: 32px 28px;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    letter-spacing: 0.15em;
    margin: 0 0 4px;
  }
  .subtitle {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    letter-spacing: 0.1em;
    margin-bottom: 24px;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--paper-dark);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 18px;
    text-align: center;
    min-width: 110px;
  }
  .stat-card .label { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.05em; }
  .stat-card .value { font-size: 20px; font-weight: bold; margin-top: 2px; }
  .stat-card .value.small { font-size: 15px; }

  /* ── 街道マップ（実画像＋ルキルキマーカー） ── */
  .map-wrap {
    position: relative;
    margin: 30px 0 40px;
    border: 2px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    line-height: 0;
  }
  .map-wrap img.base-map {
    display: block;
    width: 100%;
    height: auto;
  }
  .ruki-marker {
    position: absolute;
    width: 7%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -100%);
    transition: left 1.4s ease-in-out, top 1.4s ease-in-out;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5));
  }
  .ruki-marker img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 55%, rgba(255,255,255,0) 75%);
  }
  .ruki-marker .pin-dot {
    position: absolute;
    left: 50%;
    bottom: -6px;
    width: 10px;
    height: 10px;
    background: var(--red-seal);
    border: 2px solid var(--paper);
    border-radius: 50%;
    transform: translateX(-50%);
  }

  /* ── 俳句巻 ── */
  .haiku-section h2 {
    font-size: 18px;
    border-bottom: 2px solid var(--line);
    padding-bottom: 6px;
    margin-bottom: 16px;
    letter-spacing: 0.1em;
  }
  .haiku-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .haiku-card {
    background: var(--paper-dark);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
  }
  .haiku-card .station {
    font-size: 12px;
    color: var(--red-seal);
    font-weight: bold;
    margin-bottom: 6px;
  }
  .haiku-card .haiku-body {
    white-space: pre-line;
    font-size: 15px;
    line-height: 1.7;
  }
  .haiku-card .meta {
    margin-top: 8px;
    font-size: 10px;
    color: var(--ink-soft);
  }
  .empty-note {
    color: var(--ink-soft);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 30px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="scroll">
  <h1>東海道五十三次 道中記</h1>
  <div class="subtitle">ルキルキと歩く、京都・三条大橋から江戸・日本橋への旅</div>

  <div class="stats">
    <div class="stat-card"><div class="label">現在地</div><div class="value small" id="stat-station">-</div></div>
    <div class="stat-card"><div class="label">歩いた距離</div><div class="value" id="stat-km">-</div></div>
    <div class="stat-card"><div class="label">進捗</div><div class="value" id="stat-pct">-</div></div>
    <div class="stat-card"><div class="label">旅の日数</div><div class="value" id="stat-day">-</div></div>
    <div class="stat-card"><div class="label">次の目的地</div><div class="value small" id="stat-next">-</div></div>
  </div>

  <div class="map-wrap">
    <img class="base-map" src="./tokaido_map.jpg" alt="東海道五十三宿場絵図">
    <div class="ruki-marker" id="ruki-marker">
      <img src="./ruki_icon.png" alt="ルキルキ">
      <div class="pin-dot"></div>
    </div>
  </div>

  <div class="haiku-section">
    <h2>道中の句集</h2>
    <div id="haiku-container">
      <div class="empty-note">読み込み中...</div>
    </div>
  </div>

  <div class="footer-note">MagatokiLab ArtAR / ルキルキ ｜ 60秒ごとに自動更新</div>
</div>

<script>
const API_URL = 'https://magatoki-ai-backend.onrender.com/api/journey/status';

// 地図画像(1376x768)上で、実際に描かれた道（黒い線）を目視でたどった
// ウェイポイント（%表記）。京都・三条大橋(0%)→江戸・日本橋(100%)の順。
// 地図を差し替えた場合はここも合わせて調整が必要。
const ROAD_WAYPOINTS = [
  [9.4, 39.1], [12.4, 33.9], [14.5, 30.6], [18.9, 28.6], [24.0, 28.9],
  [28.3, 33.2], [31.2, 39.1], [33.1, 44.3], [33.4, 51.4], [34.9, 57.3],
  [37.8, 62.5], [40.7, 65.8], [43.6, 69.0], [47.2, 71.0], [50.9, 71.4],
  [54.5, 71.0], [58.1, 68.4], [60.3, 63.8], [62.5, 59.2], [65.4, 54.0],
  [68.3, 50.1], [71.2, 48.8], [74.9, 49.2], [78.5, 50.1], [82.1, 49.7],
  [85.8, 49.2], [89.4, 47.9], [92.3, 44.9], [94.5, 42.3],
];

function pointAtRatio(ratio) {
  const t = Math.max(0, Math.min(1, ratio)) * (ROAD_WAYPOINTS.length - 1);
  const i = Math.floor(t);
  const frac = t - i;
  const a = ROAD_WAYPOINTS[i];
  const b = ROAD_WAYPOINTS[Math.min(i + 1, ROAD_WAYPOINTS.length - 1)];
  return [a[0] + (b[0] - a[0]) * frac, a[1] + (b[1] - a[1]) * frac];
}

async function render() {
  let data;
  try {
    const res = await fetch(API_URL);
    data = await res.json();
  } catch (e) {
    document.getElementById('haiku-container').innerHTML = '<div class="empty-note">データの取得に失敗しました</div>';
    return;
  }

  const currentKm = data.total_distance_km || 0;
  const currentStation = data.current_station || {};
  const ratio = data.progress_ratio || 0;

  document.getElementById('stat-station').textContent = currentStation.name || '-';
  document.getElementById('stat-km').textContent = `${currentKm.toFixed(1)} km`;
  document.getElementById('stat-pct').textContent = `${Math.round(ratio * 100)}%`;
  document.getElementById('stat-day').textContent = `第${data.day_count || 1}日目`;
  document.getElementById('stat-next').textContent = data.next_station
    ? `${data.next_station.name}（あと${(data.next_station.km - currentKm).toFixed(1)}km）`
    : '日本橋到達！';

  const [x, y] = pointAtRatio(ratio);
  const marker = document.getElementById('ruki-marker');
  marker.style.left = `${x}%`;
  marker.style.top = `${y}%`;

  // ── 俳句一覧 ──
  const haikuContainer = document.getElementById('haiku-container');
  const logs = data.haiku_log || [];
  if (logs.length === 0) {
    haikuContainer.innerHTML = '<div class="empty-note">まだ道中で詠んだ俳句はありません</div>';
  } else {
    haikuContainer.innerHTML = '<div class="haiku-list"></div>';
    const list = haikuContainer.querySelector('.haiku-list');
    logs.forEach(log => {
      const card = document.createElement('div');
      card.className = 'haiku-card';
      const date = log.created_at ? new Date(log.created_at).toLocaleDateString('ja-JP') : '';
      card.innerHTML = `
        <div class="station">${log.station_name || ''}にて</div>
        <div class="haiku-body">${(log.haiku || '').replace(/</g, '&lt;')}</div>
        <div class="meta">${date}${log.weather ? ' ｜ ' + log.weather : ''}</div>
      `;
      list.appendChild(card);
    });
  }
}

render();
setInterval(render, 60_000);
</script>

</body>
</html>
