<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東海道五十三次 道中記 ｜ ルキルキの旅</title>
<style>
  :root {
    --paper: #f2e6c9;
    --paper-dark: #e6d5a8;
    --ink: #3a2c1a;
    --ink-soft: #6b5a3e;
    --red-seal: #a83232;
    --line: #8b7346;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: linear-gradient(180deg, #d9c69a, #c9b482);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    color: var(--ink);
  }

  .scroll {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--paper);
    border: 3px double var(--line);
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    padding: 32px 28px;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    letter-spacing: 0.15em;
    margin: 0 0 4px;
  }
  .subtitle {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    letter-spacing: 0.1em;
    margin-bottom: 24px;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--paper-dark);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 18px;
    text-align: center;
    min-width: 110px;
  }
  .stat-card .label { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.05em; }
  .stat-card .value { font-size: 20px; font-weight: bold; margin-top: 2px; }
  .stat-card .value.small { font-size: 15px; }

  /* ── 街道マップ（実画像＋ルキルキマーカー） ── */
  .map-wrap {
    position: relative;
    margin: 30px 0 40px;
    border: 2px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    line-height: 0;
  }
  .map-wrap img.base-map {
    display: block;
    width: 100%;
    height: auto;
  }
  .ruki-marker {
    position: absolute;
    width: 6.5%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -100%);
    transition: left 1.4s ease-in-out, top 1.4s ease-in-out;
  }
  .ruki-marker .icon-wrap {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5));
  }
  .ruki-marker img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 55%, rgba(255,255,255,0) 75%);
  }
  .ruki-marker .pin-dot {
    position: absolute;
    left: 50%;
    bottom: -6px;
    width: 10px;
    height: 10px;
    background: var(--red-seal);
    border: 2px solid var(--paper);
    border-radius: 50%;
    transform: translateX(-50%);
  }

  /* ── 現在地の吹き出し ── */
  .speech-bubble {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 6px;
    background: #fffdf5;
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
    box-shadow: 1px 2px 3px rgba(0,0,0,0.25);
  }
  .speech-bubble::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--ink);
  }
  .speech-bubble::before {
    content: "";
    position: absolute;
    top: calc(100% - 1.5px);
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #fffdf5;
    z-index: 1;
  }

  /* ── 俳句巻 ── */
  .haiku-section h2 {
    font-size: 18px;
    border-bottom: 2px solid var(--line);
    padding-bottom: 6px;
    margin-bottom: 16px;
    letter-spacing: 0.1em;
  }
  .haiku-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .haiku-card {
    background: var(--paper-dark);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
  }
  .haiku-card .station {
    font-size: 12px;
    color: var(--red-seal);
    font-weight: bold;
    margin-bottom: 6px;
  }
  .haiku-card .haiku-body {
    white-space: pre-line;
    font-size: 15px;
    line-height: 1.7;
  }
  .haiku-card .meta {
    margin-top: 8px;
    font-size: 10px;
    color: var(--ink-soft);
  }
  .empty-note {
    color: var(--ink-soft);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 30px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="scroll">
  <h1>東海道五十三次 道中記</h1>
  <div class="subtitle">ルキルキと歩く、京都・三条大橋から江戸・日本橋への旅</div>

  <div class="stats">
    <div class="stat-card"><div class="label">現在地</div><div class="value small" id="stat-station">-</div></div>
    <div class="stat-card"><div class="label">歩いた距離</div><div class="value" id="stat-km">-</div></div>
    <div class="stat-card"><div class="label">進捗</div><div class="value" id="stat-pct">-</div></div>
    <div class="stat-card"><div class="label">旅の日数</div><div class="value" id="stat-day">-</div></div>
    <div class="stat-card"><div class="label">次の目的地</div><div class="value small" id="stat-next">-</div></div>
  </div>

  <div class="map-wrap">
    <img class="base-map" src="./tokaido_map.png" alt="ルキルキ東海道五十三次の旅">
    <div class="ruki-marker" id="ruki-marker">
      <div class="speech-bubble" id="ruki-bubble">-</div>
      <div class="icon-wrap">
        <img src="./ruki_icon.png" alt="ルキルキ">
      </div>
      <div class="pin-dot"></div>
    </div>
  </div>

  <div class="haiku-section">
    <h2>道中の句集</h2>
    <div id="haiku-container">
      <div class="empty-note">読み込み中...</div>
    </div>
  </div>

  <div class="footer-note">MagatokiLab ArtAR / ルキルキ ｜ 60秒ごとに自動更新</div>
</div>

<script>
const API_URL = 'https://magatoki-ai-backend.onrender.com/api/journey/status';

// journey.py の TOKAIDO_ROUTE と同じ順序（index 0=三条大橋, 1-53=宿場, 54=日本橋）。
// station.name は「◯◯宿」の形で来るため、末尾の「宿」を除いた名前で照合する。
const STATION_NAMES = [
  '三条大橋','大津','草津','石部','水口','土山','坂下','関','亀山','庄野','石薬師','四日市','桑名',
  '宮','鳴海','池鯉鮒','岡崎','藤川','赤坂','御油','吉田','二川',
  '白須賀','新居','舞坂','浜松','見付','袋井','掛川','日坂','金谷','島田','藤枝',
  '岡部','丸子','府中','江尻','興津','由比','蒲原','吉原','原','沼津','三島',
  '箱根','小田原','大磯','平塚','藤沢','戸塚','保土ヶ谷','神奈川','川崎','品川','日本橋',
];

// 地図画像(map.png)上の実際のピン位置を画像処理（Hough変換＋最近傍トレース）で
// 抽出した座標（%表記）。STATION_NAMESと同じ順序でindexが対応する。
const ROAD_POINTS = [
  [12.0, 42.0],  // 0: 三条大橋（始点、目視推定）
  [20.14, 40.42], [21.41, 41.97], [22.82, 43.2], [24.28, 44.35], [25.55, 46.15],
  [27.06, 47.38], [28.62, 48.53], [30.13, 49.59], [31.88, 50.0], [33.2, 50.08],
  [34.46, 48.53], [35.92, 48.12], [37.53, 48.61], [38.85, 50.0], [39.97, 51.72],
  [41.48, 52.29], [42.5, 54.1], [43.08, 56.39], [43.42, 58.76], [44.15, 60.48],
  [45.08, 62.45], [46.25, 63.51], [47.13, 65.48], [48.44, 66.87], [50.0, 67.53],
  [51.51, 68.1], [53.07, 68.67], [54.34, 70.31], [55.89, 71.13], [57.45, 71.29],
  [58.91, 70.72], [60.42, 69.82], [61.84, 68.84], [63.35, 69.0], [64.71, 67.94],
  [66.03, 66.54], [67.39, 65.89], [69.0, 65.89], [70.46, 66.63], [71.97, 65.48],
  [73.04, 63.6], [74.35, 62.12], [75.77, 61.14], [76.84, 59.34], [77.86, 57.53],
  [79.18, 56.31], [80.54, 55.24], [82.15, 55.24], [83.12, 53.77], [84.05, 51.88],
  [85.61, 51.31], [87.26, 50.74], [88.68, 48.94],
  [94.0, 50.0],  // 54: 日本橋（終点、目視推定）
];

function stationIndex(name) {
  if (!name) return 0;
  const bare = name.replace(/宿$/, '');
  const i = STATION_NAMES.indexOf(bare);
  return i === -1 ? 0 : i;
}

// 現在地・次の目的地・累積距離から、2地点間を距離の割合で線形補間した座標を返す
function currentPosition(data) {
  const curIdx = stationIndex(data.current_station && data.current_station.name);
  const curPoint = ROAD_POINTS[curIdx];

  if (!data.next_station) return curPoint;

  const nextIdx = stationIndex(data.next_station.name);
  const nextPoint = ROAD_POINTS[nextIdx];

  const curKm = (data.current_station && data.current_station.km) || 0;
  const nextKm = data.next_station.km;
  const totalKm = data.total_distance_km || 0;

  const span = nextKm - curKm;
  const frac = span > 0 ? Math.max(0, Math.min(1, (totalKm - curKm) / span)) : 0;

  return [
    curPoint[0] + (nextPoint[0] - curPoint[0]) * frac,
    curPoint[1] + (nextPoint[1] - curPoint[1]) * frac,
  ];
}

async function render() {
  let data;
  try {
    const res = await fetch(API_URL);
    data = await res.json();
  } catch (e) {
    document.getElementById('haiku-container').innerHTML = '<div class="empty-note">データの取得に失敗しました</div>';
    return;
  }

  const currentKm = data.total_distance_km || 0;
  const currentStation = data.current_station || {};

  document.getElementById('stat-station').textContent = currentStation.name || '-';
  document.getElementById('stat-km').textContent = `${currentKm.toFixed(1)} km`;
  document.getElementById('stat-pct').textContent = `${Math.round((data.progress_ratio || 0) * 100)}%`;
  document.getElementById('stat-day').textContent = `第${data.day_count || 1}日目`;
  document.getElementById('stat-next').textContent = data.next_station
    ? `${data.next_station.name}（あと${(data.next_station.km - currentKm).toFixed(1)}km）`
    : '日本橋到達！';

  const [x, y] = currentPosition(data);
  const marker = document.getElementById('ruki-marker');
  marker.style.left = `${x}%`;
  marker.style.top = `${y}%`;
  document.getElementById('ruki-bubble').textContent = currentStation.name || '-';

  // ── 俳句一覧 ──
  const haikuContainer = document.getElementById('haiku-container');
  const logs = data.haiku_log || [];
  if (logs.length === 0) {
    haikuContainer.innerHTML = '<div class="empty-note">まだ道中で詠んだ俳句はありません</div>';
  } else {
    haikuContainer.innerHTML = '<div class="haiku-list"></div>';
    const list = haikuContainer.querySelector('.haiku-list');
    logs.forEach(log => {
      const card = document.createElement('div');
      card.className = 'haiku-card';
      const date = log.created_at ? new Date(log.created_at).toLocaleDateString('ja-JP') : '';
      card.innerHTML = `
        <div class="station">${log.station_name || ''}にて</div>
        <div class="haiku-body">${(log.haiku || '').replace(/</g, '&lt;')}</div>
        <div class="meta">${date}${log.weather ? ' ｜ ' + log.weather : ''}</div>
      `;
      list.appendChild(card);
    });
  }
}

render();
setInterval(render, 60_000);
</script>

</body>
</html>
